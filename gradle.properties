org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric toolchain (versions checked against meta.fabricmc.net)
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
loom_version=1.17.16

# fabric-api: additive API, so a client slightly behind the build still works.
fabric_version=0.141.4+1.21.11

# Bumped on every jar handed out.
#
# Not cosmetic: the whole point of the mod is to almost never update, so the rare
# updates are expensive and builds must never be confused. Two different builds once
# shipped under the same name, distinguishable only by sha256 — and one of them had
# every block sounding like stone. That can't be debugged from the client log: the
# version string is identical.
mod_version=0.110.5
maven_group=com.rufana
archives_base_name=instantlore
